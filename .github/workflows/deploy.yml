# CI/CD: tự động build mỗi khi push/pull request và tự động deploy lên MonsterASP.NET khi push lên main
name: Build và Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # WebDeploy chỉ chạy được trên Windows
    runs-on: windows-latest
    env:
      WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
      HAS_DB_CONNECTION: ${{ secrets.DB_CONNECTION_STRING != '' }}
    steps:
      - name: Lấy source code
        uses: actions/checkout@v7

      - name: Cài đặt .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # win-x86 theo hướng dẫn deploy của MonsterASP.NET
      - name: Publish
        run: dotnet publish --configuration Release --runtime win-x86 --self-contained false --output ./publish

      # Repo để public nên không commit mật khẩu: tạo appsettings.Production.json từ các secret.
      # Trên hosting app chạy ở môi trường Production nên file này ghi đè các giá trị trong appsettings.json
      #  - DB_CONNECTION_STRING: chuỗi kết nối CSDL
      #  - ADMIN_PASSWORD (buổi 13): mật khẩu tài khoản admin mặc định, không khai báo thì không tạo tài khoản
      #  - SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD (buổi 13): gửi email xác thực tài khoản / quên mật khẩu
      - name: Tạo appsettings.Production.json
        if: env.HAS_DB_CONNECTION == 'true'
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          $settings = @{ ConnectionStrings = @{ DefaultConnection = $env:DB_CONNECTION_STRING } }
          if ($env:ADMIN_PASSWORD) {
            $settings.DefaultAccounts = @(@{ Password = $env:ADMIN_PASSWORD })
          }
          if ($env:SMTP_HOST) {
            $settings.EmailSettings = @{
              Host = $env:SMTP_HOST
              UserName = $env:SMTP_USERNAME
              Password = $env:SMTP_PASSWORD
              FromEmail = $env:SMTP_USERNAME
            }
          }
          $settings | ConvertTo-Json -Depth 5 |
            Set-Content -Path ./publish/appsettings.Production.json -Encoding utf8

      - name: Nhắc cấu hình secret CSDL
        if: env.HAS_DB_CONNECTION != 'true'
        run: echo "::warning::Chưa khai báo secret DB_CONNECTION_STRING nên website trên hosting chưa kết nối được CSDL."

      # Không deploy với pull request; chỉ deploy khi push lên main (hoặc chạy tay) và đã khai báo secrets.
      # Action tự dừng application pool, upload code mới rồi chạy lại để không bị khoá file .dll
      - name: Deploy lên MonsterASP.NET qua WebDeploy
        if: github.event_name != 'pull_request' && env.WEBSITE_NAME != ''
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      - name: Nhắc cấu hình secrets
        if: github.event_name != 'pull_request' && env.WEBSITE_NAME == ''
        run: echo "::warning::Chưa khai báo secrets WebDeploy (WEBSITE_NAME, SERVER_COMPUTER_NAME, SERVER_USERNAME, SERVER_PASSWORD) nên bỏ qua bước deploy."
